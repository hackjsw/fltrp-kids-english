pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen 8443 ssl;
        server_name 192.168.3.7;
        ssl_certificate /etc/nginx/tls/site.crt;
        ssl_certificate_key /etc/nginx/tls/site.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        root /usr/share/nginx/html;
        index index.html;
        expires -1;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "microphone=(self), camera=()" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /local-ca.crt {
            alias /etc/nginx/tls/local-ca.crt;
            default_type application/x-x509-ca-cert;
        }
        location = /local-ca.cer {
            alias /etc/nginx/tls/local-ca.cer;
            default_type application/x-x509-ca-cert;
        }
        location ~ /\. { return 404; }
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
        location ~ ^/(images|audio)/ {
            expires 1d;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
